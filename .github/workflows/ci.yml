name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpt:
    name: PHPT (PHP ${{ matrix.php }} NTS, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        arch: [x86-64, aarch64]
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # Without git in the image, checkout downloads the API archive instead of cloning, and the
      # archive leaves out the export-ignore paths (.github/, tests/, fuzz/, benchmarks/).
      - name: Install git, so that checkout makes a clone
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - name: Build, check warnings and symbols, run PHPT
        run: bash .github/ci/phpt.sh
        env:
          JF_EXPECT_ZTS: "0"

  # PHP 8.6 NTS, blocking. php:8.6-rc-cli is a ZTS build, so this lane builds the pinned release
  # candidate from source. When 8.6.0 is released, move 8.6 into the phpt matrix if php:8.6-cli is NTS.
  phpt-86:
    name: PHPT (PHP 8.6.0RC4 NTS from source, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      PHP_VERSION: 8.6.0RC4
      PHP_URL: https://downloads.php.net/~mbeccati/php-8.6.0RC4.tar.xz
      PHP_SHA256: 93f208da9ae059bf6863b0e1d101e6c6475a7b0f0acbf6c084950ab522f514d8
    steps:
      # Without git in the image, checkout downloads the API archive instead of cloning, and the
      # archive leaves out the export-ignore paths (.github/, tests/, fuzz/, benchmarks/).
      - name: Install git, so that checkout makes a clone
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - name: Build PHP, build the extension, check warnings and symbols, run PHPT
        run: bash .github/ci/phpt-source.sh

  # clang 19 cannot build an ASan PHP 8.6, so that build uses gcc.
  sanitizer:
    name: ASan/UBSan, Zend allocator run and fuzz corpus (PHP ${{ matrix.php }} debug, ${{ matrix.cc }})
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.3.36
            cc: clang
            url: https://www.php.net/distributions/php-8.3.36.tar.xz
            sha256: dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd
          - php: 8.6.0RC4
            cc: gcc
            url: https://downloads.php.net/~mbeccati/php-8.6.0RC4.tar.xz
            sha256: 93f208da9ae059bf6863b0e1d101e6c6475a7b0f0acbf6c084950ab522f514d8
    env:
      PHP_VERSION: ${{ matrix.php }}
      PHP_URL: ${{ matrix.url }}
      PHP_SHA256: ${{ matrix.sha256 }}
      SAN_CC: ${{ matrix.cc }}
    steps:
      # Without git in the image, checkout downloads the API archive instead of cloning, and the
      # archive leaves out the export-ignore paths (.github/, tests/, fuzz/, benchmarks/).
      - name: Install git, so that checkout makes a clone
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - name: Build PHP with sanitizers and run the suites
        run: bash .github/ci/sanitizer.sh

  # 8.6 is setup-php's nightly of the PHP-8.6 branch, not the pinned release candidate.
  macos:
    name: PHPT (PHP ${{ matrix.php }} NTS, macOS arm64)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.6"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: opcache.enable_cli=0
      - name: Build, check warnings and symbols, run PHPT
        run: bash .github/ci/phpt-macos.sh

  # php:8.6.0RC4-cli is a ZTS build; JF_EXPECT_ZTS makes phpt.sh fail if an image is not.
  zts:
    name: PHPT (PHP ${{ matrix.php }} ZTS, x86-64)
    runs-on: ubuntu-24.04
    container: php:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            image: 8.3-zts
          - php: "8.4"
            image: 8.4-zts
          - php: "8.5"
            image: 8.5-zts
          - php: 8.6.0RC4
            image: 8.6.0RC4-cli
    steps:
      # Without git in the image, checkout downloads the API archive instead of cloning, and the
      # archive leaves out the export-ignore paths (.github/, tests/, fuzz/, benchmarks/).
      - name: Install git, so that checkout makes a clone
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - name: Build, check warnings and symbols, run PHPT
        run: bash .github/ci/phpt.sh
        env:
          JF_EXPECT_ZTS: "1"

  # The validating scan compiled out (-DJF_DISABLE_SCAN): PHPT, and the scan differential driver's output
  # against a normal build of the same tree.
  disable-scan:
    name: PHPT and scan differential, validating scan compiled out (PHP 8.3 NTS, x86-64)
    runs-on: ubuntu-24.04
    container: php:8.3-cli
    steps:
      # Without git in the image, checkout downloads the API archive instead of cloning, and the
      # archive leaves out the export-ignore paths (.github/, tests/, fuzz/, benchmarks/).
      - name: Install git, so that checkout makes a clone
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - name: Build with -DJF_DISABLE_SCAN, run PHPT, compare the driver output with a normal build
        run: bash .github/ci/disable-scan.sh

  # tests/zts/jf_threads.c: 8 threads with a request each, on a ZTS debug PHP with the embed SAPI,
  # under ThreadSanitizer, with a planted race as negative control, then PHPT on the same build.
  zts-threads:
    name: ZTS multi-thread harness under ThreadSanitizer (PHP 8.5 debug, aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the checkout holds tests/ and .github/ci/
        run: |
          if [ ! -d tests ] || [ ! -d .github/ci ]; then
            echo "::error::tests/ or .github/ci/ is missing: the checkout is the export-ignore archive, not a clone (install git before actions/checkout)"
            exit 1
          fi
      - name: Lower address-space randomisation to what ThreadSanitizer accepts
        run: if [ "$(sysctl -n vm.mmap_rnd_bits)" -gt 28 ]; then sudo sysctl -w vm.mmap_rnd_bits=28; fi
      - name: Build PHP and the extension with ThreadSanitizer, run the harness, its control and PHPT
        run: docker run --rm -v "$PWD":/src -w /src debian:trixie-slim bash .github/ci/zts-threads.sh
